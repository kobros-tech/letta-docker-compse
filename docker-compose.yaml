version: "3.9"

services:
  letta_db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - ./.data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  letta:
    image: letta/letta:latest
    ports:
      - "8283:8283"
    env_file:
      - .env.letta
    depends_on:
      - letta_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
